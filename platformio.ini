; DOOM for LILYGO TTGO VGA32 (FabGL VGA) — same board profile as ESP32-Basic-vga
; https://github.com/fg1998/ESP32-Basic-vga

[env:lilygo-vga32]
platform = espressif32@6.12.0
board = pico32
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_size = 4MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.psram = true
board_build.partitions = huge_app.csv
lib_deps =
	fdivitto/FabGL
extra_scripts =
	tools/patch_fabgl.py
build_flags =
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DCMAP256
	-DDOOMGENERIC_RESX=320
	-DDOOMGENERIC_RESY=200
	-DHAVE_STDINT_H
	-DHAVE_UNISTD_H
	-DFABGLIB_MINFREELARGESTBLOCK=1024
	-Isrc/doom
	-O2
	-ffast-math
	-Wno-unused-variable
	-Wno-unused-function
	-Wno-maybe-uninitialized
	-Wno-misleading-indentation
build_src_filter =
	+<*>
	-<doom/doomgeneric_*.c>
	-<doom/i_sdl*.c>
	-<doom/i_allegro*.c>
